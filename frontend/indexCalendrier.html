<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Calendrier Académique - CamunoLearn</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--sub:#475569;
  --green:#00602a;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* Material Symbols fix */
.material-symbols-outlined{
  font-family:'Material Symbols Outlined';
  font-weight:normal;font-style:normal;font-size:20px;
  display:inline-block;line-height:1;text-transform:none;
  letter-spacing:normal;word-wrap:normal;white-space:nowrap;direction:ltr;
  font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;
  vertical-align:middle;user-select:none;
}

/* NAV */
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-l{display:flex;align-items:center;gap:12px}
.nav-logo{font-family:Manrope;font-weight:900;font-size:1.1rem;color:#00602a;text-decoration:none}
.nav-logo b{color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-family:inherit;font-weight:600;font-size:.82rem;cursor:pointer;border:none;transition:.15s}
.btn-primary{background:#00602a;color:#fff}.btn-primary:hover{background:#004d22}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{background:var(--surface);color:var(--text)}
.btn-sm{padding:6px 14px;font-size:.78rem}

/* LAYOUT */
.layout{display:flex;height:calc(100vh - 60px)}

/* SIDEBAR */
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);padding:16px;overflow-y:auto;flex-shrink:0}
@media(max-width:768px){.sidebar{display:none}}

.sid-title{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin-bottom:10px;margin-top:16px}
.sid-title:first-child{margin-top:0}

/* Mini cal */
.mini-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mini-header span{font-family:Manrope;font-weight:700;font-size:.82rem}
.mini-nav-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:3px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.mini-nav-btn:hover{background:var(--border);color:var(--text)}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mini-lbl{font-size:.6rem;font-weight:700;color:var(--sub);text-align:center;padding:3px 0}
.mini-d{font-size:.7rem;text-align:center;padding:3px 1px;border-radius:5px;cursor:pointer;color:var(--muted)}
.mini-d:hover{background:var(--border);color:var(--text)}
.mini-d.today{background:#00602a;color:#fff;font-weight:700}
.mini-d.fade{opacity:.3}

/* Cat filters */
.cat-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:.78rem;margin-bottom:3px}
.cat-item:hover{background:var(--border)}
.cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cat-name{flex:1}
.cat-x{color:var(--sub);font-size:.65rem;font-weight:700;opacity:0}
.cat-item.off .cat-x{opacity:1}
.cat-item.off .cat-name{text-decoration:line-through;opacity:.5}

/* MAIN */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* TOOLBAR */
.toolbar{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar-l{display:flex;align-items:center;gap:8px;flex:1}
.month-title{font-family:Manrope;font-weight:800;font-size:1.15rem;min-width:180px}
.view-sw{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.view-btn{padding:6px 14px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--muted);background:none;border:none;font-family:inherit}
.view-btn.on{background:#00602a;color:#fff}

/* CAL WRAP */
.cal-wrap{flex:1;overflow-y:auto}

/* MONTH */
.mth-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
.mth-hlbl{padding:8px 0;text-align:center;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sub)}
.mth-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.mth-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px;min-height:100px;cursor:pointer;position:relative}
.mth-cell:hover{background:rgba(255,255,255,.02)}
.mth-cell.today{background:rgba(0,96,42,.1)}
.mth-cell.fade .cday{opacity:.3}
.cday{font-size:.78rem;font-weight:700;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:4px}
.today .cday{background:#00602a;color:#fff}
.chip{font-size:.67rem;font-weight:600;padding:2px 7px;border-radius:5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:3px solid transparent;display:block}
.chip:hover{filter:brightness(1.15)}
.more{font-size:.63rem;color:var(--sub);padding:1px 4px;cursor:pointer}
.more:hover{color:var(--text)}

/* WEEK */
.wk-wrap{display:flex;flex-direction:column;height:100%}
.wk-head{display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
.wk-time-h{border-right:1px solid var(--border)}
.wk-dcol-h{padding:8px 0;text-align:center;border-right:1px solid var(--border)}
.wk-dname{font-size:.65rem;font-weight:700;text-transform:uppercase;color:var(--sub)}
.wk-dnum{font-size:1.2rem;font-weight:800;font-family:Manrope;line-height:1.2}
.wk-dcol-h.today .wk-dnum{background:#00602a;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto}
.wk-body{display:grid;grid-template-columns:52px repeat(7,1fr);overflow-y:auto;flex:1}
.wk-timecol{border-right:1px solid var(--border)}
.wk-tslot{height:56px;border-bottom:1px dashed rgba(255,255,255,.04);padding:3px 5px}
.wk-tlbl{font-size:.6rem;color:var(--sub);font-weight:600}
.wk-daycol{border-right:1px solid var(--border);position:relative}
.wk-slot{height:56px;border-bottom:1px dashed rgba(255,255,255,.04);cursor:pointer}
.wk-slot:hover{background:rgba(255,255,255,.02)}
.wk-ev{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 6px;font-size:.67rem;font-weight:600;cursor:pointer;overflow:hidden;z-index:3;border-left:3px solid transparent}
.wk-ev:hover{opacity:.85;z-index:10}

/* POPUP */
.ev-popup{position:fixed;z-index:900;background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;width:270px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.pop-badge{font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:999px;display:inline-block;margin-bottom:8px}
.pop-title{font-family:Manrope;font-weight:800;font-size:.9rem;margin-bottom:6px;color:#f8fafc}
.pop-row{font-size:.75rem;color:#94a3b8;display:flex;align-items:center;gap:5px;margin-bottom:3px}
.pop-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.on{display:flex}
.modal{background:#1e293b;border:1px solid #334155;border-radius:18px;width:100%;max-width:460px;box-shadow:0 32px 80px rgba(0,0,0,.5)}
.mhd{padding:18px 22px;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between}
.mhd h2{font-family:Manrope;font-weight:800;font-size:.95rem}
.mbody{padding:18px 22px;max-height:65vh;overflow-y:auto}
.mfoot{padding:14px 22px;border-top:1px solid #334155;display:flex;gap:8px;justify-content:flex-end}
.fld{width:100%;background:#0f172a;border:1.5px solid #334155;border-radius:9px;padding:9px 13px;color:#f8fafc;font-family:inherit;font-size:.85rem;outline:none}
.fld:focus{border-color:#00602a}
.lbl{display:block;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#475569;margin-bottom:4px}
.frow{margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.csel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.csel-btn{padding:7px 10px;border-radius:8px;border:1.5px solid #334155;background:transparent;color:#94a3b8;cursor:pointer;font-family:inherit;font-size:.75rem;font-weight:600;display:flex;align-items:center;gap:5px;transition:.15s}
.csel-btn:hover,.csel-btn.on{border-color:#00602a}
.csel-btn.on{color:#fff}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:10px 16px;font-size:.82rem;font-weight:600;z-index:2000;display:flex;align-items:center;gap:8px}
.toast.ok{border-color:#00602a;color:#4ade80}
.toast.err{border-color:#ef4444;color:#f87171}
</style>
</head>
<body>

<nav>
  <div class="nav-l">
    <a href="#" class="nav-logo"><b>Camuno</b>Learn</a>
    <span style="color:#475569">|</span>
    <span style="font-size:.82rem;color:#94a3b8">Calendrier Académique</span>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-ghost btn-sm" onclick="history.back()">&#8592; Retour</button>
    <button class="btn btn-primary btn-sm" onclick="openModal(null,null)" id="btn-add" style="display:none">+ Ajouter</button>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar">
    <p class="sid-title">Navigation</p>
    <div class="mini-header">
      <button class="mini-nav-btn" onclick="miniPrev()">&#8249;</button>
      <span id="mini-lbl"></span>
      <button class="mini-nav-btn" onclick="miniNext()">&#8250;</button>
    </div>
    <div class="mini-grid" id="mini-grid">
      <div class="mini-lbl">L</div><div class="mini-lbl">M</div><div class="mini-lbl">M</div>
      <div class="mini-lbl">J</div><div class="mini-lbl">V</div><div class="mini-lbl">S</div><div class="mini-lbl">D</div>
    </div>

    <p class="sid-title" style="margin-top:20px">Catégories</p>
    <div id="cat-filters"></div>
  </aside>

  <div class="main">
    <div class="toolbar">
      <div class="toolbar-l">
        <button class="btn btn-ghost btn-sm" onclick="prev()">&#8249;</button>
        <span class="month-title" id="main-lbl"></span>
        <button class="btn btn-ghost btn-sm" onclick="next()">&#8250;</button>
        <button class="btn btn-ghost btn-sm" onclick="goToday()">Aujourd'hui</button>
      </div>
      <div class="view-sw">
        <button class="view-btn on" id="vb-month" onclick="setView('month')">Mois</button>
        <button class="view-btn"    id="vb-week"  onclick="setView('week')">Semaine</button>
      </div>
    </div>
    <div class="cal-wrap" id="cal"></div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="modal">
  <div class="modal">
    <div class="mhd">
      <h2 id="mtitle">Nouvel événement</h2>
      <button onclick="closeModal()" style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:1.2rem">&#x2715;</button>
    </div>
    <div class="mbody">
      <div class="frow"><label class="lbl">Titre *</label><input id="f-title" class="fld" placeholder="Ex: Examen Algorithmique"/></div>
      <div class="frow">
        <label class="lbl">Catégorie *</label>
        <div class="csel-grid" id="csel"></div>
      </div>
      <div class="frow fgrid">
        <div><label class="lbl">Début *</label><input id="f-start" class="fld" type="datetime-local"/></div>
        <div><label class="lbl">Fin *</label><input id="f-end"   class="fld" type="datetime-local"/></div>
      </div>
      <div class="frow" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="f-allday" style="accent-color:#00602a"/>
        <label for="f-allday" style="font-size:.82rem;cursor:pointer">Journée entière</label>
      </div>
      <div class="frow"><label class="lbl">Département / Filière</label><input id="f-dept" class="fld" placeholder="Ex: Génie Informatique"/></div>
      <div class="frow"><label class="lbl">Description</label><textarea id="f-desc" class="fld" rows="3" style="resize:vertical" placeholder="Détails, salle, intervenants..."></textarea></div>
    </div>
    <div class="mfoot">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary btn-sm" onclick="saveEvent()" id="save-btn">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const API   = location.hostname==='localhost'?'http://localhost:3000/api':'https://camunolearn-api.onrender.com/api';
const TOKEN = localStorage.getItem('camunolearn_token');
const USER  = JSON.parse(localStorage.getItem('camunolearn_user')||'{}');
if (!TOKEN) location.href='indexconnexion.html';

const CAN_EDIT = ['enseignant','admin','superadmin'].includes(USER.role);
if (CAN_EDIT) document.getElementById('btn-add').style.display='flex';

const CATS = [
  {k:'cours',       n:'Cours',           c:'#3b82f6'},
  {k:'cc',          n:'Contrôle Continu',c:'#f59e0b'},
  {k:'examen',      n:'Examen',          c:'#ef4444'},
  {k:'tp',          n:'TP',              c:'#8b5cf6'},
  {k:'rattrapage',  n:'Rattrapage',      c:'#f97316'},
  {k:'reunion',     n:'Réunion Admin',   c:'#6b7280'},
  {k:'caq',         n:'Éval. CAQ',       c:'#0ea5e9'},
  {k:'vie_etudiante',n:'Vie Étudiante', c:'#10b981'},
  {k:'conge',       n:'Congé / Férié',   c:'#94a3b8'},
  {k:'stage',       n:'Stage',           c:'#84cc16'},
];
const CMAP = Object.fromEntries(CATS.map(c=>[c.k,c]));
const MFR  = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DFR  = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

let cur     = new Date();
let view    = 'month';
let events  = [];
let active  = new Set(CATS.map(c=>c.k));
let editId  = null;
let selCat  = null;

// ── INIT
async function init(){
  buildCatFilters();
  buildCselGrid();
  await load();
  render();
  renderMini();
}

// ── LOAD
async function load(){
  try{
    const m=cur.getMonth()+1,y=cur.getFullYear();
    const sc=encodeURIComponent(USER.school||'');
    const r=await fetch(`${API}/calendar/events?school=${sc}&month=${m}&year=${y}`,{headers:{Authorization:'Bearer '+TOKEN}});
    const d=await r.json();
    if(d.success) events=d.events;
  }catch(e){}
}

async function reload(){ await load(); render(); renderMini(); }

// ── NAV
function prev(){ view==='month'?cur.setMonth(cur.getMonth()-1):cur.setDate(cur.getDate()-7); reload(); }
function next(){ view==='month'?cur.setMonth(cur.getMonth()+1):cur.setDate(cur.getDate()+7); reload(); }
function goToday(){ cur=new Date(); reload(); }
function setView(v){ view=v; document.getElementById('vb-month').className='view-btn'+(v==='month'?' on':''); document.getElementById('vb-week').className='view-btn'+(v==='week'?' on':''); render(); }
function miniPrev(){ cur.setMonth(cur.getMonth()-1); reload(); }
function miniNext(){ cur.setMonth(cur.getMonth()+1); reload(); }

// ── CAT FILTERS
function buildCatFilters(){
  document.getElementById('cat-filters').innerHTML = CATS.map(c=>`
    <div class="cat-item" id="cf-${c.k}" onclick="toggleCat('${c.k}')">
      <div class="cat-dot" style="background:${c.c}"></div>
      <span class="cat-name">${c.n}</span>
      <span class="cat-x">OFF</span>
    </div>`).join('');
}
function toggleCat(k){
  if(active.has(k)) active.delete(k); else active.add(k);
  document.getElementById('cf-'+k).classList.toggle('off',!active.has(k));
  render();
}

// ── CSEL GRID (modal)
function buildCselGrid(){
  document.getElementById('csel').innerHTML=CATS.map(c=>`
    <button class="csel-btn" id="cs-${c.k}" onclick="pickCat('${c.k}')">
      <span style="width:9px;height:9px;border-radius:50%;background:${c.c};display:inline-block;flex-shrink:0"></span>${c.n}
    </button>`).join('');
}
function pickCat(k){
  selCat=k;
  document.querySelectorAll('.csel-btn').forEach(b=>{b.classList.remove('on');b.style.background='';b.style.borderColor='';});
  const cat=CMAP[k]; const btn=document.getElementById('cs-'+k);
  btn.classList.add('on'); btn.style.background=cat.c; btn.style.borderColor=cat.c;
}

// ── ISO LOCAL
function toISO(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }

// ── FILTERED EVENTS
function filtered(){ return events.filter(e=>active.has(e.category)); }

// ── MONTH VIEW
function renderMonth(){
  const y=cur.getFullYear(),m=cur.getMonth();
  document.getElementById('main-lbl').textContent=MFR[m]+' '+y;
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  let dow=first.getDay(); if(dow===0) dow=7; dow--;
  const today=new Date();
  const evs=filtered();

  let html=`<div>
    <div class="mth-head">${DFR.map(d=>`<div class="mth-hlbl">${d}</div>`).join('')}</div>
    <div class="mth-grid">`;

  const total=Math.ceil((dow+last.getDate())/7)*7;
  for(let i=0;i<total;i++){
    const dn=i-dow+1;
    const dt=new Date(y,m,dn);
    const isToday=dt.toDateString()===today.toDateString();
    const isOther=dn<1||dn>last.getDate();
    const ds=dt.toISOString().split('T')[0];

    const dayEvs=evs.filter(e=>{
      const s=new Date(e.start_date),ee=new Date(e.end_date);
      return dt>=new Date(s.toDateString())&&dt<=new Date(ee.toDateString());
    });

    html+=`<div class="mth-cell${isToday?' today':''}${isOther?' fade':''}" onclick="onDayClick('${ds}')">
      <div class="cday">${dt.getDate()}</div>`;

    dayEvs.slice(0,3).forEach(e=>{
      const cat=CMAP[e.category]||{c:'#3b82f6'};
      html+=`<span class="chip" style="background:${e.color||cat.c}22;color:${e.color||cat.c};border-left-color:${e.color||cat.c}"
              onclick="event.stopPropagation();showPopup(event,'${e.id}')">${e.title}</span>`;
    });
    if(dayEvs.length>3) html+=`<div class="more" onclick="event.stopPropagation()">+${dayEvs.length-3} autres</div>`;
    html+=`</div>`;
  }
  html+=`</div></div>`;
  document.getElementById('cal').innerHTML=html;
}

// ── WEEK VIEW
function renderWeek(){
  const today=new Date();
  const d=new Date(cur);
  const dow=d.getDay()===0?7:d.getDay();
  d.setDate(d.getDate()-dow+1);
  const days=Array.from({length:7},(_,i)=>{ const dd=new Date(d); dd.setDate(d.getDate()+i); return dd; });

  document.getElementById('main-lbl').textContent=
    days[0].getDate()+' '+MFR[days[0].getMonth()].slice(0,3)+' – '+days[6].getDate()+' '+MFR[days[6].getMonth()]+' '+days[6].getFullYear();

  const HOURS=Array.from({length:16},(_,i)=>i+7);
  const evs=filtered();

  let html=`<div class="wk-wrap">
    <div class="wk-head">
      <div class="wk-time-h"></div>
      ${days.map(dd=>{
        const isT=dd.toDateString()===today.toDateString();
        return `<div class="wk-dcol-h${isT?' today':''}">
          <div class="wk-dname">${DFR[dd.getDay()===0?6:dd.getDay()-1]}</div>
          <div class="wk-dnum">${dd.getDate()}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="wk-body">
      <div class="wk-timecol">${HOURS.map(h=>`<div class="wk-tslot"><span class="wk-tlbl">${String(h).padStart(2,'0')}h</span></div>`).join('')}</div>
      ${days.map(dd=>{
        const ds=dd.toISOString().split('T')[0];
        const dayEvs=evs.filter(e=>new Date(e.start_date).toDateString()===dd.toDateString());
        return `<div class="wk-daycol">
          ${HOURS.map(h=>`<div class="wk-slot" onclick="onSlotClick('${ds}',${h})"></div>`).join('')}
          ${dayEvs.map(e=>{
            const cat=CMAP[e.category]||{c:'#3b82f6'};
            const s=new Date(e.start_date),ee=new Date(e.end_date);
            const top=((s.getHours()-7)+s.getMinutes()/60)*56;
            const ht=Math.max(28,((ee-s)/3600000)*56);
            return `<div class="wk-ev" style="top:${top}px;height:${Math.min(ht,500)}px;background:${e.color||cat.c}22;border-left-color:${e.color||cat.c};color:${e.color||cat.c}"
                     onclick="event.stopPropagation();showPopup(event,'${e.id}')">${e.title}</div>`;
          }).join('')}
        </div>`;
      }).join('')}
    </div>
  </div>`;
  document.getElementById('cal').innerHTML=html;
}

// ── MINI CAL
function renderMini(){
  const y=cur.getFullYear(),m=cur.getMonth();
  document.getElementById('mini-lbl').textContent=MFR[m].slice(0,3)+' '+y;
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  let dow=first.getDay(); if(dow===0) dow=7; dow--;
  const today=new Date();
  const grid=document.getElementById('mini-grid');
  const labels=Array.from(grid.querySelectorAll('.mini-lbl'));
  grid.innerHTML='';
  labels.forEach(l=>grid.appendChild(l.cloneNode(true)));
  const total=Math.ceil((dow+last.getDate())/7)*7;
  for(let i=0;i<total;i++){
    const dn=i-dow+1;
    const dt=new Date(y,m,dn);
    const isT=dt.toDateString()===today.toDateString();
    const isO=dn<1||dn>last.getDate();
    const div=document.createElement('div');
    div.className='mini-d'+(isT?' today':'')+(isO?' fade':'');
    div.textContent=dt.getDate();
    div.onclick=()=>{ cur=new Date(dt); reload(); };
    grid.appendChild(div);
  }
}

// ── MAIN RENDER
function render(){ view==='month'?renderMonth():renderWeek(); }

// ── POPUP
function showPopup(evt,id){
  document.querySelectorAll('.ev-popup').forEach(p=>p.remove());
  const e=events.find(ev=>ev.id===id); if(!e) return;
  const cat=CMAP[e.category]||{c:'#3b82f6',n:e.category};
  const fmtDt=d=>new Date(d).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

  const pop=document.createElement('div');
  pop.className='ev-popup';
  pop.style.top=Math.min(evt.clientY+8,window.innerHeight-280)+'px';
  pop.style.left=Math.min(evt.clientX+8,window.innerWidth-285)+'px';

  pop.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
      <span class="pop-badge" style="background:${cat.c}22;color:${cat.c}">${cat.n}</span>
      <button onclick="this.closest('.ev-popup').remove()" style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:1.1rem;line-height:1">&#x2715;</button>
    </div>
    <div class="pop-title">${e.title}</div>
    <div class="pop-row">&#128197; ${fmtDt(e.start_date)} &#8594; ${fmtDt(e.end_date)}</div>
    ${e.department?`<div class="pop-row">&#128101; ${e.department}</div>`:''}
    ${e.description?`<div class="pop-row" style="margin-top:4px;font-size:.73rem">${e.description}</div>`:''}
    ${e.created_by_name?`<div class="pop-row">&#128100; ${e.created_by_name}</div>`:''}
    ${CAN_EDIT?`<div class="pop-actions">
      <button class="btn btn-ghost btn-sm" onclick="editEv('${e.id}');this.closest('.ev-popup').remove()">&#9998; Modifier</button>
      <button class="btn btn-ghost btn-sm" onclick="dupEv('${e.id}');this.closest('.ev-popup').remove()">&#10064; Dupliquer</button>
      <button class="btn btn-sm" style="background:#450a0a;color:#f87171;border:none" onclick="delEv('${e.id}');this.closest('.ev-popup').remove()">&#128465;</button>
    </div>`:''}`;

  document.body.appendChild(pop);
  setTimeout(()=>document.addEventListener('click',()=>pop.remove(),{once:true}),50);
}

// ── DAY / SLOT CLICK
function onDayClick(ds){
  if(!CAN_EDIT) return;
  openModal(ds+'T08:00',ds+'T09:00');
}
function onSlotClick(ds,h){
  if(!CAN_EDIT) return;
  const hh=String(h).padStart(2,'0'),h2=String(h+1).padStart(2,'0');
  openModal(`${ds}T${hh}:00`,`${ds}T${h2}:00`);
}

// ── MODAL
function openModal(start,end,ev=null){
  editId=ev?ev.id:null;
  selCat=ev?ev.category:null;
  document.getElementById('mtitle').textContent=ev?'Modifier l\'événement':'Nouvel événement';
  document.getElementById('f-title').value=ev?.title||'';
  document.getElementById('f-desc').value=ev?.description||'';
  document.getElementById('f-dept').value=ev?.department||'';
  document.getElementById('f-allday').checked=ev?.all_day||false;
  document.getElementById('f-start').value=ev?toISO(new Date(ev.start_date)):(start||'');
  document.getElementById('f-end').value=ev?toISO(new Date(ev.end_date)):(end||'');
  // Reset cat selection
  document.querySelectorAll('.csel-btn').forEach(b=>{b.classList.remove('on');b.style.background='';b.style.borderColor='';});
  if(selCat){ const btn=document.getElementById('cs-'+selCat); if(btn){ btn.classList.add('on'); btn.style.background=CMAP[selCat].c; btn.style.borderColor=CMAP[selCat].c; } }
  document.getElementById('modal').classList.add('on');
  setTimeout(()=>document.getElementById('f-title').focus(),100);
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); editId=null; selCat=null; }

// ── SAVE
async function saveEvent(){
  const title=document.getElementById('f-title').value.trim();
  const start=document.getElementById('f-start').value;
  const end=document.getElementById('f-end').value;
  if(!title){ toast('Titre requis.','err'); return; }
  if(!selCat){ toast('Choisissez une catégorie.','err'); return; }
  if(!start||!end){ toast('Dates requises.','err'); return; }
  if(new Date(end)<new Date(start)){ toast('Fin avant début.','err'); return; }
  const btn=document.getElementById('save-btn'); btn.disabled=true; btn.textContent='...';
  try{
    const r=await fetch(editId?`${API}/calendar/events/${editId}`:`${API}/calendar/events`,{
      method:editId?'PUT':'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},
      body:JSON.stringify({title,category:selCat,start_date:start,end_date:end,all_day:document.getElementById('f-allday').checked,department:document.getElementById('f-dept').value.trim(),description:document.getElementById('f-desc').value.trim(),school:USER.school})
    });
    const d=await r.json();
    if(d.success){ toast(editId?'Modifié !':'Créé !','ok'); closeModal(); await reload(); }
    else toast(d.message||'Erreur.','err');
  }catch(e){ toast('Erreur réseau.','err'); }
  btn.disabled=false; btn.textContent='Enregistrer';
}

// ── EDIT / DEL / DUP
function editEv(id){ const e=events.find(ev=>ev.id===id); if(e) openModal(null,null,e); }

async function delEv(id){
  if(!confirm('Supprimer ?')) return;
  const r=await fetch(`${API}/calendar/events/${id}`,{method:'DELETE',headers:{Authorization:'Bearer '+TOKEN}});
  const d=await r.json();
  if(d.success){ toast('Supprimé.','ok'); await reload(); } else toast(d.message||'Erreur.','err');
}

async function dupEv(id){
  const off=prompt('Décaler de combien de jours ?','7'); if(!off) return;
  const r=await fetch(`${API}/calendar/events/${id}/duplicate`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify({offset_days:parseInt(off)})});
  const d=await r.json();
  if(d.success){ toast('Dupliqué !','ok'); await reload(); } else toast(d.message||'Erreur.','err');
}

// ── TOAST
function toast(msg,type='ok'){
  const el=document.createElement('div');
  el.className='toast '+type;
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
init();
</script>
