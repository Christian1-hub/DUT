<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Calendrier Académique - CamunoLearn</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--sub:#475569;--green:#00602a;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* NAV */
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:Manrope;font-weight:900;font-size:1.1rem;color:#00602a;text-decoration:none}
.logo b{color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;font-family:inherit;font-weight:600;font-size:.8rem;cursor:pointer;border:none}
.btn-g{background:#00602a;color:#fff}.btn-g:hover{background:#004d22}
.btn-o{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-o:hover{color:var(--text);background:var(--surface)}

/* LAYOUT */
.layout{display:flex;height:calc(100vh - 60px)}

/* SIDEBAR */
.sidebar{width:230px;background:var(--surface);border-right:1px solid var(--border);padding:16px;overflow-y:auto;flex-shrink:0}
@media(max-width:700px){.sidebar{display:none}}
.s-title{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin:16px 0 8px}
.s-title:first-child{margin-top:0}

/* Mini cal */
.mc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mc-hd span{font-family:Manrope;font-weight:700;font-size:.82rem}
.mc-nav{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1rem;padding:2px 5px;border-radius:5px}
.mc-nav:hover{background:var(--border);color:var(--text)}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mc-lbl{font-size:.58rem;font-weight:700;color:var(--sub);text-align:center;padding:2px}
.mc-d{font-size:.68rem;text-align:center;padding:3px 1px;border-radius:4px;cursor:pointer;color:var(--muted)}
.mc-d:hover{background:var(--border);color:var(--text)}
.mc-d.today{background:#00602a;color:#fff;font-weight:700}
.mc-d.out{opacity:.25}

/* Cat */
.cat-item{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;cursor:pointer;font-size:.77rem;margin-bottom:2px;transition:.1s}
.cat-item:hover{background:var(--border)}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cat-lbl{flex:1}
.cat-off{font-size:.6rem;font-weight:700;color:var(--sub);opacity:0}
.cat-item.off .cat-lbl{text-decoration:line-through;opacity:.45}
.cat-item.off .cat-off{opacity:1}

/* MAIN */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.toolbar{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tl{display:flex;align-items:center;gap:8px;flex:1}
.ml{font-family:Manrope;font-weight:800;font-size:1.1rem;min-width:175px}
.vsw{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.vb{padding:6px 13px;font-size:.77rem;font-weight:600;cursor:pointer;color:var(--muted);background:none;border:none;font-family:inherit}
.vb.on{background:#00602a;color:#fff}

/* CAL */
.cal{flex:1;overflow-y:auto}

/* MONTH */
.mh{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
.mhl{padding:7px 0;text-align:center;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sub)}
.mg{display:grid;grid-template-columns:repeat(7,1fr)}
.mc{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:5px;min-height:110px;cursor:pointer;position:relative;overflow:hidden}
.mc:hover{background:rgba(255,255,255,.02)}
.mc.tod{background:rgba(0,96,42,.12)}
.mc.out .dn{opacity:.28}
.dn{font-size:.76rem;font-weight:700;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:3px}
.tod .dn{background:#00602a;color:#fff}

/* EVENT CHIPS — supporte multi-day span */
.ev-row{position:relative;height:18px;margin-bottom:2px}
/* chip normal */
.chip{position:absolute;left:0;right:0;top:0;height:17px;font-size:.66rem;font-weight:600;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:15px;margin-bottom:3px}
.chip:hover{filter:brightness(1.2)}
/* multi-day — s'étend sur la grille */
.chip-start{border-radius:4px 0 0 4px;left:0;right:-1px}
.chip-mid  {border-radius:0;left:-1px;right:-1px}
.chip-end  {border-radius:0 4px 4px 0;left:-1px;right:0}
.chip-solo {border-radius:4px}
.more{font-size:.62rem;color:var(--sub);padding:0 3px;cursor:pointer}
.more:hover{color:var(--text)}

/* WEEK */
.wk-wrap{display:flex;flex-direction:column;height:100%}
.wk-hd{display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
.wk-th{border-right:1px solid var(--border)}
.wk-dh{padding:8px 0;text-align:center;border-right:1px solid var(--border)}
.wk-dn{font-size:.62rem;font-weight:700;text-transform:uppercase;color:var(--sub)}
.wk-dd{font-size:1.2rem;font-weight:800;font-family:Manrope}
.wk-dh.tod .wk-dd{background:#00602a;color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:2px auto 0}
.wk-body{display:grid;grid-template-columns:52px repeat(7,1fr);overflow-y:auto;flex:1}
.wk-tc{border-right:1px solid var(--border)}
.wk-ts{height:56px;border-bottom:1px dashed rgba(255,255,255,.04);padding:3px 5px}
.wk-tl{font-size:.6rem;color:var(--sub);font-weight:600}
.wk-dc{border-right:1px solid var(--border);position:relative}
.wk-sl{height:56px;border-bottom:1px dashed rgba(255,255,255,.04);cursor:pointer}
.wk-sl:hover{background:rgba(255,255,255,.02)}
.wk-ev{position:absolute;left:2px;right:2px;border-radius:5px;padding:3px 6px;font-size:.66rem;font-weight:600;cursor:pointer;overflow:hidden;z-index:3;border-left:3px solid transparent}
.wk-ev:hover{opacity:.85;z-index:10}

/* POPUP */
.popup{position:fixed;z-index:900;background:#1e293b;border:1px solid #334155;border-radius:13px;padding:15px;width:265px;box-shadow:0 20px 60px rgba(0,0,0,.65);animation:pop .15s ease}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.pb{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 9px;border-radius:999px;display:inline-block;margin-bottom:7px}
.pt{font-family:Manrope;font-weight:800;font-size:.9rem;margin-bottom:5px;color:#f8fafc}
.pr{font-size:.74rem;color:#94a3b8;margin-bottom:3px}
.pa{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.mdl{background:#1e293b;border:1px solid #334155;border-radius:16px;width:100%;max-width:450px;box-shadow:0 32px 80px rgba(0,0,0,.5)}
.mhd{padding:16px 20px;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between}
.mhd h2{font-family:Manrope;font-weight:800;font-size:.92rem}
.mbody{padding:16px 20px;max-height:60vh;overflow-y:auto}
.mft{padding:12px 20px;border-top:1px solid #334155;display:flex;gap:8px;justify-content:flex-end}
.fld{width:100%;background:#0f172a;border:1.5px solid #334155;border-radius:8px;padding:8px 12px;color:#f8fafc;font-family:inherit;font-size:.83rem;outline:none}
.fld:focus{border-color:#00602a}
.lbl{display:block;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#475569;margin-bottom:4px}
.fr{margin-bottom:11px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.csg{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.csb{padding:6px 9px;border-radius:7px;border:1.5px solid #334155;background:transparent;color:#94a3b8;cursor:pointer;font-family:inherit;font-size:.73rem;font-weight:600;display:flex;align-items:center;gap:5px}
.csb:hover,.csb.on{border-color:#00602a}
.csb.on{color:#fff}

/* TOAST */
.toast{position:fixed;bottom:18px;right:18px;background:#1e293b;border:1px solid #334155;border-radius:9px;padding:9px 15px;font-size:.8rem;font-weight:600;z-index:2000;display:flex;align-items:center;gap:7px}
.toast.ok{border-color:#00602a;color:#4ade80}
.toast.err{border-color:#ef4444;color:#f87171}
</style>
</head>
<body>

<nav>
  <a href="#" class="logo"><b>Camuno</b>Learn &nbsp;|&nbsp; <span style="font-size:.82rem;color:#94a3b8;font-weight:500">Calendrier — <span id="school-name"></span></span></a>
  <div style="display:flex;gap:8px">
    <button class="btn btn-o" onclick="history.back()">&#8592; Retour</button>
    <button class="btn btn-g" onclick="openModal(null,null)" id="btn-add" style="display:none">+ Ajouter</button>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar">
    <p class="s-title">Navigation</p>
    <div class="mc-hd">
      <button class="mc-nav" onclick="miniPrev()">&#8249;</button>
      <span id="mc-lbl"></span>
      <button class="mc-nav" onclick="miniNext()">&#8250;</button>
    </div>
    <div class="mc-grid" id="mc-grid">
      <div class="mc-lbl">L</div><div class="mc-lbl">M</div><div class="mc-lbl">M</div>
      <div class="mc-lbl">J</div><div class="mc-lbl">V</div><div class="mc-lbl">S</div><div class="mc-lbl">D</div>
    </div>
    <p class="s-title">Catégories</p>
    <div id="cats"></div>
  </aside>

  <div class="main">
    <div class="toolbar">
      <div class="tl">
        <button class="btn btn-o" onclick="prev()">&#8249;</button>
        <span class="ml" id="ml"></span>
        <button class="btn btn-o" onclick="next()">&#8250;</button>
        <button class="btn btn-o" onclick="goToday()">Aujourd'hui</button>
      </div>
      <div class="vsw">
        <button class="vb on" id="vb-m" onclick="setView('month')">Mois</button>
        <button class="vb"    id="vb-w" onclick="setView('week')">Semaine</button>

    </div>
    <div class="cal" id="cal"></div>
  </div>
</div>

<!-- MODAL -->
<div class="ov" id="modal">
  <div class="mdl">
    <div class="mhd">
      <h2 id="m-title">Nouvel événement</h2>
      <button onclick="closeModal()" style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:1.2rem">&#x2715;</button>
    </div>
    <div class="mbody">
      <div class="fr"><label class="lbl">Titre *</label><input id="f-title" class="fld" placeholder="Ex: Examen Algorithmique S1"/></div>
      <div class="fr"><label class="lbl">Catégorie *</label><div class="csg" id="csel"></div></div>
      <div class="fr fg">
        <div><label class="lbl">Début *</label><input id="f-start" class="fld" type="datetime-local"/></div>
        <div><label class="lbl">Fin *</label><input id="f-end" class="fld" type="datetime-local"/></div>
      </div>
      <div class="fr" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="f-all" style="accent-color:#00602a"/>
        <label for="f-all" style="font-size:.82rem;cursor:pointer">Journée entière</label>
      </div>
      <div class="fr"><label class="lbl">Département / Filière</label><input id="f-dept" class="fld" placeholder="Ex: Génie Informatique"/></div>
      <div class="fr"><label class="lbl">Description</label><textarea id="f-desc" class="fld" rows="2" style="resize:vertical"></textarea></div>
    </div>
    <div class="mft">
      <button class="btn btn-o" onclick="closeModal()">Annuler</button>
      <button class="btn btn-g" onclick="saveEvent()" id="save-btn">Enregistrer</button>
    </div>
  </div>
</div>

let cur=new Date(), view='month', events=[], active=new Set(CATS.map(c=>c.k)), editId=null, selCat=null;

async function init(){
  document.getElementById('school-name').textContent = USER.school || 'Établissement';
  buildCats(); buildCsel();
  await load();
  render(); renderMini();
}

async function load(){
  try{
    const m=cur.getMonth()+1,y=cur.getFullYear();
    const sc=encodeURIComponent(USER.school||'');
    const r=await fetch(`${API}/calendar/events?school=${sc}&month=${m}&year=${y}`,{headers:{Authorization:'Bearer '+TOKEN}});
    const d=await r.json();
    events = d.success ? d.events : [];
  }catch(e){ events=[]; }
}
async function reload(){ await load(); render(); renderMini(); }

// ── HELPERS
function eStart(e){ return new Date(e.start_date); }
function eEnd(e){   return new Date(e.end_date); }
function sameDay(a,b){ return a.toDateString()===b.toDateString(); }
function isBetween(d,s,e){ return d>=new Date(s.toDateString())&&d<=new Date(e.toDateString()); }
function toISO(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function filtered(){ return events.filter(e=>active.has(e.category)); }

// ── NAV
function prev(){ view==='month'?cur.setMonth(cur.getMonth()-1):cur.setDate(cur.getDate()-7); reload(); }
function next(){ view==='month'?cur.setMonth(cur.getMonth()+1):cur.setDate(cur.getDate()+7); reload(); }
function goToday(){ cur=new Date(); reload(); }
function setView(v){ view=v; document.getElementById('vb-m').className='vb'+(v==='month'?' on':''); document.getElementById('vb-w').className='vb'+(v==='week'?' on':''); render(); }
function miniPrev(){ cur.setMonth(cur.getMonth()-1); reload(); }
function miniNext(){ cur.setMonth(cur.getMonth()+1); reload(); }

// ── CATS
function buildCats(){
  document.getElementById('cats').innerHTML=CATS.map(c=>`
    <div class="cat-item" id="cf-${c.k}" onclick="toggleCat('${c.k}')">
      <div class="cat-dot" style="background:${c.c}"></div>
      <span class="cat-lbl">${c.n}</span>
      <span class="cat-off">OFF</span>
    </div>`).join('');
}
function toggleCat(k){
  active.has(k)?active.delete(k):active.add(k);
  document.getElementById('cf-'+k).classList.toggle('off',!active.has(k));
  render();
}
function buildCsel(){
  document.getElementById('csel').innerHTML=CATS.map(c=>`
    <button class="csb" id="cs-${c.k}" onclick="pickCat('${c.k}')">
      <span style="width:8px;height:8px;border-radius:50%;background:${c.c};display:inline-block;flex-shrink:0"></span>${c.n}
    </button>`).join('');
}
function pickCat(k){
  selCat=k;
  document.querySelectorAll('.csb').forEach(b=>{b.classList.remove('on');b.style.background='';b.style.borderColor='';});
  const btn=document.getElementById('cs-'+k);
  btn.classList.add('on'); btn.style.background=CM[k].c; btn.style.borderColor=CM[k].c;
}

// ── MONTH RENDER ─────────────────────────────────────────────
function renderMonth(){
  const y=cur.getFullYear(),m=cur.getMonth();
  document.getElementById('ml').textContent=MFR[m]+' '+y;
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  let dow=first.getDay(); if(dow===0)dow=7; dow--;
  const today=new Date();
  const evs=filtered();
  const total=Math.ceil((dow+last.getDate())/7)*7;
  const weeks=total/7;

  // Construire tableau des jours par semaine
  const grid=[];
  for(let w=0;w<weeks;w++){
    const week=[];
    for(let d=0;d<7;d++){
      const dn=w*7+d-dow+1;
      week.push(new Date(y,m,dn));
    }
    grid.push(week);
  }

  // Placement des événements par semaine avec système de rows
  // rowMap[semaine][row] = eventId occupé
  const weekLayouts=grid.map(week=>{
    const rows=[]; // rows[row] = liste d'events placés
    const placed=[]; // [{event, row, startCol, endCol}]

    evs.forEach(e=>{
      const es=eStart(e),ee=eEnd(e);
      // Trouver les colonnes de cette semaine occupées par cet événement
      let startCol=-1,endCol=-1;
      week.forEach((dt,ci)=>{
        if(isBetween(dt,es,ee)){
          if(startCol===-1) startCol=ci;
          endCol=ci;
        }
      });
      if(startCol===-1) return; // pas dans cette semaine

      // Trouver une row libre
      let row=0;
      while(true){
        if(!rows[row]) rows[row]=[];
        const conflict=rows[row].some(p=>!(p.endCol<startCol||p.startCol>endCol));
        if(!conflict) break;
        row++;
      }
      if(!rows[row]) rows[row]=[];
      rows[row].push({event:e,startCol,endCol});
      placed.push({event:e,row,startCol,endCol});
    });

    return placed;
  });

  const ROW_H=22; // hauteur par row en px
  const DAY_H=Math.max(80, weeks>5?90:100); // hauteur min par cellule

  let html=`<div>
    <div class="mh">${DFR.map(d=>`<div class="mhl">${d}</div>`).join('')}</div>
    <div class="mg" style="grid-auto-rows:${DAY_H}px">`;

  grid.forEach((week,wi)=>{
    const placed=weekLayouts[wi];
    const maxRow=placed.length?Math.max(...placed.map(p=>p.row)):0;
    const cellH=Math.max(DAY_H,(maxRow+2)*ROW_H+28);

    // Compter événements par cellule pour "+N autres"
    const countByCol=Array(7).fill(0);
    const maxVisible=Math.floor((cellH-28)/ROW_H);

    placed.forEach(p=>{
      for(let c=p.startCol;c<=p.endCol;c++) countByCol[c]++;
    });

    week.forEach((dt,ci)=>{
      const isT=sameDay(dt,today);
      const isO=dt.getMonth()!==m;
      const ds=dt.toISOString().split('T')[0];
      const col=ci;

      // Placer les chips positionnés en absolute dans chaque cellule
      // On calcule les chips qui commencent dans cette colonne
      const myPlaced=placed.filter(p=>p.startCol===col);
      const hidden=placed.filter(p=>p.startCol===col&&p.row>=maxVisible);

      html+=`<div class="mc${isT?' tod':''}${isO?' out':''}" style="position:relative;height:${cellH}px" onclick="onDay('${ds}')">
        <div class="dn">${dt.getDate()}</div>`;

      // Afficher chips
      placed.forEach(p=>{
        if(p.startCol!==col) return;
        if(p.row>=maxVisible-1) return; // caché
        const e=p.event;
        const cat=CM[e.category]||{c:'#3b82f6'};
        const ecol=e.color||cat.c;
        const span=p.endCol-p.startCol+1;
        const top=28+p.row*ROW_H;
        // Calculer la largeur en % sur plusieurs colonnes
        // On utilise position absolute et width calculé via JS post-render
        // Pour simplifier: on utilise data-span
        const es=eStart(e),ee=eEnd(e);
        const isStart=true;
        const roundL=sameDay(dt,es)||col===0;
        const roundR=sameDay(new Date(week[p.endCol]),ee)||p.endCol===6;
        const borderR=roundR?'4px':'0';
        const borderL=roundL?'4px':'0';
        html+=`<div class="chip" data-id="${e.id}" data-span="${span}" data-col="${col}"
               style="position:absolute;top:${top}px;left:2px;right:2px;
                      background:${ecol}22;color:${ecol};
                      border-left:${roundL?'3px solid '+ecol:'none'};
                      border-radius:${borderL} ${borderR} ${borderR} ${borderL};
                      height:${ROW_H-2}px;line-height:${ROW_H-2}px;z-index:${p.row+1}"
               onclick="event.stopPropagation();showPop(event,'${e.id}')"
               title="${e.title}">
               ${e.title}
             </div>`;
      });

      // "+N autres" si besoin
      const hiddenCount=placed.filter(p=>p.startCol===col&&p.row>=maxVisible-1).length;
      if(hiddenCount>0) html+=`<div class="more" style="position:absolute;bottom:3px;left:4px" onclick="event.stopPropagation()">+${hiddenCount} autres</div>`;

      html+=`</div>`;
    });
  });

  html+=`</div></div>`;
  document.getElementById('cal').innerHTML=html;

  // Post-render: étendre les chips multi-colonnes
  extendChips();
}

function extendChips(){
  const grid=document.querySelector('.mg');
  if(!grid) return;
  const cells=Array.from(grid.querySelectorAll('.mc'));
  if(!cells.length) return;
  const cellW=cells[0].getBoundingClientRect().width;

  document.querySelectorAll('.chip[data-span]').forEach(chip=>{
    const span=parseInt(chip.dataset.span)||1;
    if(span>1){
      chip.style.right='-'+(( span-1)*cellW-4)+'px';
      chip.style.width='auto';
    }
  });
}

// ── WEEK RENDER ───────────────────────────────────────────────
function renderWeek(){
  const today=new Date();
  const d=new Date(cur);
  const dow=d.getDay()===0?7:d.getDay();
  d.setDate(d.getDate()-dow+1);
  const days=Array.from({length:7},(_,i)=>{ const dd=new Date(d); dd.setDate(d.getDate()+i); return dd; });
  document.getElementById('ml').textContent=
    days[0].getDate()+' '+MFR[days[0].getMonth()].slice(0,3)+' – '+days[6].getDate()+' '+MFR[days[6].getMonth()]+' '+days[6].getFullYear();
  const HOURS=Array.from({length:16},(_,i)=>i+7);
  const evs=filtered();

  let html=`<div class="wk-wrap">
    <div class="wk-hd">
      <div class="wk-th"></div>
      ${days.map(dd=>{
        const isT=sameDay(dd,today);
        return `<div class="wk-dh${isT?' tod':''}">
          <div class="wk-dn">${DFR[dd.getDay()===0?6:dd.getDay()-1]}</div>
          <div class="wk-dd">${dd.getDate()}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="wk-body">
      <div class="wk-tc">${HOURS.map(h=>`<div class="wk-ts"><span class="wk-tl">${String(h).padStart(2,'0')}h</span></div>`).join('')}</div>
      ${days.map(dd=>{
        const ds=dd.toISOString().split('T')[0];
        const dayEvs=evs.filter(e=>sameDay(new Date(e.start_date),dd));
        return `<div class="wk-dc">
          ${HOURS.map(h=>`<div class="wk-sl" onclick="onSlot('${ds}',${h})"></div>`).join('')}
          ${dayEvs.map(e=>{
            const cat=CM[e.category]||{c:'#3b82f6'};
            const col=e.color||cat.c;
            const s=eStart(e),en=eEnd(e);
            let top=0,ht=56*2;
            if(!e.all_day){
              top=((s.getHours()-7)+s.getMinutes()/60)*56;
              ht=Math.max(24,((en-s)/3600000)*56);
            }
            return `<div class="wk-ev" style="top:${top}px;height:${Math.min(ht,480)}px;background:${col}22;border-left-color:${col};color:${col}"
                     onclick="event.stopPropagation();showPop(event,'${e.id}')">${e.title}</div>`;
          }).join('')}
        </div>`;
      }).join('')}
    </div>
  </div>`;
  document.getElementById('cal').innerHTML=html;
}

// ── MINI CAL
function renderMini(){
  const y=cur.getFullYear(),m=cur.getMonth();
  document.getElementById('mc-lbl').textContent=MFR[m].slice(0,3)+' '+y;
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  let dow=first.getDay(); if(dow===0)dow=7; dow--;
  const today=new Date();
  const g=document.getElementById('mc-grid');
  g.innerHTML='<div class="mc-lbl">L</div><div class="mc-lbl">M</div><div class="mc-lbl">M</div><div class="mc-lbl">J</div><div class="mc-lbl">V</div><div class="mc-lbl">S</div><div class="mc-lbl">D</div>';
  const tot=Math.ceil((dow+last.getDate())/7)*7;
  for(let i=0;i<tot;i++){
    const dn=i-dow+1,dt=new Date(y,m,dn);
    const isT=sameDay(dt,today),isO=dt.getMonth()!==m;
    const div=document.createElement('div');
    div.className='mc-d'+(isT?' today':'')+(isO?' out':'');
    div.textContent=dt.getDate();
    div.onclick=()=>{ cur=new Date(dt); reload(); };
    g.appendChild(div);
  }
}

function render(){ view==='month'?renderMonth():renderWeek(); }

// ── POPUP
function showPop(evt,id){
  document.querySelectorAll('.popup').forEach(p=>p.remove());
  const e=events.find(ev=>ev.id===id); if(!e) return;
  const cat=CM[e.category]||{c:'#3b82f6',n:e.category};
  const col=e.color||cat.c;
  const fmt=d=>new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  const fmtdt=d=>new Date(d).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

  const pop=document.createElement('div');
  pop.className='popup';
  pop.style.top=Math.min(evt.clientY+10,window.innerHeight-280)+'px';
  pop.style.left=Math.min(evt.clientX+10,window.innerWidth-275)+'px';

  const dateStr = e.all_day
    ? (e.start_date===e.end_date ? fmt(e.start_date) : `${fmt(e.start_date)} → ${fmt(e.end_date)}`)
    : `${fmtdt(e.start_date)} → ${fmtdt(e.end_date)}`;

  pop.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <span class="pb" style="background:${col}22;color:${col}">${cat.n}</span>
      <button onclick="this.closest('.popup').remove()" style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:1.1rem;line-height:1">&#x2715;</button>
    </div>
    <div class="pt">${e.title}</div>
    <div class="pr">&#128197; ${dateStr}</div>
    ${e.department?`<div class="pr">&#128101; ${e.department}</div>`:''}
    ${e.description?`<div class="pr" style="margin-top:4px;font-size:.72rem">${e.description}</div>`:''}
    ${CAN?`<div class="pa">
      <button class="btn btn-o" style="padding:5px 10px;font-size:.73rem" onclick="editEv('${e.id}');this.closest('.popup').remove()">&#9998; Modifier</button>
      <button class="btn btn-o" style="padding:5px 10px;font-size:.73rem" onclick="dupEv('${e.id}');this.closest('.popup').remove()">&#10064; Dupliquer</button>
      <button class="btn" style="padding:5px 10px;font-size:.73rem;background:#450a0a;color:#f87171;border:none" onclick="delEv('${e.id}');this.closest('.popup').remove()">&#128465;</button>
    </div>`:''}`;

  document.body.appendChild(pop);
  setTimeout(()=>document.addEventListener('click',()=>pop.remove(),{once:true}),50);
}

// ── CLICS
function onDay(ds){ if(!CAN)return; openModal(ds+'T08:00',ds+'T09:00'); }
function onSlot(ds,h){ if(!CAN)return; const hh=String(h).padStart(2,'0'),h2=String(h+1).padStart(2,'0'); openModal(`${ds}T${hh}:00`,`${ds}T${h2}:00`); }

// ── MODAL
function openModal(start,end,ev=null){
  editId=ev?ev.id:null; selCat=ev?ev.category:null;
  document.getElementById('m-title').textContent=ev?'Modifier':'Nouvel événement';
  document.getElementById('f-title').value=ev?.title||'';
  document.getElementById('f-desc').value=ev?.description||'';
  document.getElementById('f-dept').value=ev?.department||'';
  document.getElementById('f-all').checked=ev?.all_day||false;
  document.getElementById('f-start').value=ev?toISO(eStart(ev)):(start||'');
  document.getElementById('f-end').value=ev?toISO(eEnd(ev)):(end||'');
  document.querySelectorAll('.csb').forEach(b=>{b.classList.remove('on');b.style.background='';b.style.borderColor='';});
  if(selCat){ const btn=document.getElementById('cs-'+selCat); if(btn){btn.classList.add('on');btn.style.background=CM[selCat].c;btn.style.borderColor=CM[selCat].c;} }
  document.getElementById('modal').classList.add('on');
  setTimeout(()=>document.getElementById('f-title').focus(),100);
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); editId=null; selCat=null; }

async function saveEvent(){
  const title=document.getElementById('f-title').value.trim();
  const start=document.getElementById('f-start').value;
  const end=document.getElementById('f-end').value;
  if(!title){toast('Titre requis.','err');return;}
  if(!selCat){toast('Catégorie requise.','err');return;}
  if(!start||!end){toast('Dates requises.','err');return;}
  const btn=document.getElementById('save-btn'); btn.disabled=true; btn.textContent='...';
  try{
    const r=await fetch(editId?`${API}/calendar/events/${editId}`:`${API}/calendar/events`,{
      method:editId?'PUT':'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},
      body:JSON.stringify({title,category:selCat,start_date:start,end_date:end,all_day:document.getElementById('f-all').checked,department:document.getElementById('f-dept').value.trim(),description:document.getElementById('f-desc').value.trim(),school:USER.school||'IUT de Douala'})
    });
    const d=await r.json();
    if(d.success){toast(editId?'Modifié !':'Créé !','ok');closeModal();await reload();}
    else toast(d.message||'Erreur.','err');
  }catch(e){toast('Erreur réseau.','err');}
  btn.disabled=false;btn.textContent='Enregistrer';
}

function editEv(id){ const e=events.find(ev=>ev.id===id); if(e) openModal(null,null,e); }
async function delEv(id){
  if(!confirm('Supprimer ?'))return;
  try{
    const r=await fetch(`${API}/calendar/events/${id}`,{method:'DELETE',headers:{Authorization:'Bearer '+TOKEN}});
    const d=await r.json();
    if(d.success){toast('Supprimé.','ok');await reload();}else toast(d.message||'Erreur.','err');
  }catch(e){toast('Erreur réseau.','err');}
}
async function dupEv(id){
  const off=prompt('Décaler de combien de jours ?','7'); if(!off)return;
  try{
    const r=await fetch(`${API}/calendar/events/${id}/duplicate`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify({offset_days:parseInt(off)})});
    const d=await r.json();
    if(d.success){toast('Dupliqué !','ok');await reload();}else toast(d.message||'Erreur.','err');
  }catch(e){toast('Erreur réseau.','err');}
}

function toast(msg,type='ok'){
  const el=document.createElement('div');
  el.className='toast '+type; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
init();
</script>
